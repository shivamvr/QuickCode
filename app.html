<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
    <style id="mystyle"></style>
  </head>
  <body>
    <div id="root"><!-- code from local storage --></div>
    <script id="myscript"></script>
    <script id="myscript2"></script>
    <script>
      const gets = (selector) => {
        return document.querySelector(selector);
      };
      const getsAll = (selector) => {
        return document.querySelectorAll(selector);
      };
      // this page can be opened before the editor has stored anything, so
      // never assume a key is present
      const read = (key) => localStorage.getItem(key) || "";
      const readSettings = () => {
        try {
          return JSON.parse(localStorage.getItem("quickEdit")) || {};
        } catch (err) {
          return {};
        }
      };

      let code = read("code");
      let quickEdit = readSettings();
      let root = document.querySelector("#root");
      let myScript2 = gets("#myscript2");
      let localJs = read("js");
      let mystyle = gets("#mystyle");
      let localCss = read("css");

      root.innerHTML = code;
      mystyle.innerHTML = localCss;

      if (quickEdit.js) {
        myScript2.innerHTML = localJs;
      }

      if (quickEdit.css) {
        mystyle.disabled = false;
      } else {
        mystyle.disabled = true;
      }

      window.onload = () => {
        // innerHTML never runs a <script>, so copy an inline one out of the
        // rendered markup into a script element of our own, which does run it
        let myScript = gets("#myscript");
        let data = gets(`#root>script`);
        if (data) {
          myScript.innerHTML = data.innerHTML;
        }
      };


      window.addEventListener("storage", () => {
        let myScript2 = gets("#myscript2");
        let quickEdit = readSettings();
        let code = read("code");
        let localCss = read("css").replace(/\s+/g, " ");
        let localJs = read("js");
        let root = document.querySelector("#root");
        let mystyle = gets("#mystyle");
        root.innerHTML = code;
        mystyle.innerHTML = localCss;
        myScript2.innerHTML = localJs;
        let script = gets(`#root>script`);
    

        if (script || quickEdit.js ) {
          window.location.reload();
        }

      });
    </script>
  </body>
</html>
