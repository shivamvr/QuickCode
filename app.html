<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>App</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fff;
      }
      #preview {
        display: block;
        border: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <!-- The snippet runs inside this frame, never in this page. allow-scripts
         without allow-same-origin gives it an opaque origin, so it cannot reach
         the localStorage that holds the user's saved work. Adding
         allow-same-origin alongside allow-scripts would let the frame remove
         its own sandbox, so do not. -->
    <iframe
      id="preview"
      title="Preview"
      sandbox="allow-scripts allow-modals allow-forms allow-popups allow-downloads"
    ></iframe>
    <script src="scripts/store.js"></script>
    <script src="scripts/preview.js"></script>
    <script>
      // The three files live in IndexedDB now, one record per project, so this
      // page reads the active project rather than three localStorage keys. The
      // settings are still in localStorage: they are tiny and wanted
      // synchronously.
      let content = { code: "", css: "", js: "" };

      // Reads can finish out of order - two of them overlap every time this
      // page opens, because the first one starts before the editor has written
      // anything. A stale answer must not paint over a newer one, or the
      // preview shows something that is no longer there.
      let reads = 0;
      const load = () => {
        const mine = ++reads;
        return getProject(activeId())
          .then((found) => {
            if (mine !== reads) return false;
            if (found) content = found;
            return true;
          })
          .catch((err) => {
            console.error("Could not read the project", err);
            return false;
          });
      };

      const refresh = () => load().then((current) => { if (current) render(); });
      const readSettings = () => {
        try {
          return JSON.parse(localStorage.getItem("quickEdit")) || {};
        } catch (err) {
          return {};
        }
      };

      const frame = document.getElementById("preview");

      // Assigning srcdoc gives a brand new document, so inline script tags in
      // the snippet run on their own. The builder is the one the pane inside
      // the editor uses, so the two previews cannot drift apart; this window
      // has no console panel, so what the prelude sends goes nowhere here.
      const render = () => {
        frame.srcdoc = buildPreviewDoc(content, readSettings()).html;
      };

      refresh();

      // The editor batches its writes and pings localStorage once each batch
      // lands, so a burst still only rebuilds this once - and never shows
      // something that has not been saved.
      let pending = null;
      window.addEventListener("storage", () => {
        clearTimeout(pending);
        pending = setTimeout(refresh, 200);
      });
    </script>
  </body>
</html>
